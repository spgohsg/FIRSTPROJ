<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital I-Ching Oracle ｜ 易经占卜</title>
    <style>
        body {
            font-family: 'Georgia', 'Noto Serif SC', serif;
            background-color: #fcf8f2;
            color: #2c1a04;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .oracle-box {
            background-color: #fffaf0;
            padding: 30px;
            border-radius: 16px;
            border: 2px solid #8e2117;
            box-shadow: 0 8px 24px rgba(142,33,23,0.15);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #8e2117; margin-top: 0; font-family: 'Times New Roman', serif; }
        .coin-container {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
        }
        .coin {
            width: 70px;
            height: 70px;
            background-color: #dfb15b;
            border: 4px solid #b3862b;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.5s ease-out;
        }
        .spinning {
            animation: spin 0.1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
        button {
            background-color: #8e2117;
            color: #fffaf0;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #63140e; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .hexagram-display {
            display: flex;
            flex-direction: column-reverse; /* Builds bottom to top */
            align-items: center;
            margin: 20px 0;
            gap: 8px;
        }
        .line-yang {
            width: 160px;
            height: 14px;
            background-color: #2c1a04;
        }
        .line-yin {
            display: flex;
            width: 160px;
            height: 14px;
            justify-content: space-between;
        }
        .line-yin div {
            width: 70px;
            height: 14px;
            background-color: #2c1a04;
        }
        .changing {
            background-color: #8e2117 !important;
        }
        .changing div {
            background-color: #8e2117 !important;
        }
        .hidden { display: none !important; }
        .interpretation-panel {
            background-color: #f7ebd9;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid #8e2117;
            text-align: left;
            margin-top: 20px;
            line-height: 1.6;
        }
        .chinese-title {
            font-size: 24px;
            color: #8e2117;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .status-txt { font-style: italic; color: #666; margin: 15px 0; }
    </style>
</head>
<body>

<div class="oracle-box">
    <h1>☯️ I-Ching Oracle ｜ 易经占卜</h1>
    <p>Focus on your question, then cast the coins 6 times to form your hexagram.</p>
    <p style="font-size:14px; color:#666;">心中默念你的问题，投掷硬币6次以形成卦象。</p>
    
    <p id="tossCounter" style="font-weight: bold; color: #8e2117; margin-top:20px;">Toss 1 of 6 ｜ 第 1 次投掷</p>

    <!-- Coin Interface -->
    <div id="coinArea">
        <div class="coin-container">
            <div id="coin1" class="coin">Heads</div>
            <div id="coin2" class="coin">Heads</div>
            <div id="coin3" class="coin">Heads</div>
        </div>
        <p id="tossResultText" class="status-txt">Coins ready for casting. ｜ 准备就绪。</p>
        <button id="tossBtn" onclick="tossCoins()">🪙 Toss Coins ｜ 投掷硬币</button>
    </div>

    <!-- Hexagram Rendering Section -->
    <div id="hexagramArea" class="hexagram-display"></div>

    <!-- Deciphering Section -->
    <div id="decipherSection" class="hidden">
        <button style="background-color: #2c1a04;" onclick="decipherHexagram()">📖 Consult the Wisdom ｜ 解卦</button>
        <div id="interpretation" class="interpretation-panel hidden"></div>
        <button style="margin-top: 15px;" onclick="resetOracle()">🔄 Ask Another Question ｜ 重新占卜</button>
    </div>
</div>

<script>
    var currentToss = 0;
    var hexagramLines = []; 

    // NOTICE: All description fields now safely use backticks ` ` to prevent multi-line freeze crashes!
    var hexagramDatabase = {
        "111111": { 
            zh: `第1卦：乾为天 (Qián)`, 
            en: `Hexagram 1: The Creative (Sky)`, 
            desc: `大吉。象征天道刚健，自强不息。气势如日中天，但需防盈不可久，保持谦逊与恒心。 Great success. Symbolizes strength and persistence. Power is at its peak; act with integrity.` 
        },
        "000000": { 
            zh: `第2卦：坤为地 (Kūn)`, 
            en: `Hexagram 2: The Receptive (Earth)`, 
            desc: `温和。象征包容与顺从。顺应大势，多方配合，不宜强行出头。柔顺包容，承载万物。 Nurturing and yielding. Success comes via supportive patience rather than leading.` 
        },
        "100010": { 
            zh: `第3卦：水雷屯 (Zhūn)`, 
            en: `Hexagram 3: Difficulty at the Beginning`, 
            desc: `起始。万事开头难，如同草木破土。充满生机但也伴随混乱。不可盲动，寻找助力。 Initial growth through structural chaos. Like a seed breaking hard earth, do not force progression.` 
        },
        "010001": { 
            zh: `第4卦：山水蒙 (Méng)`, 
            en: `Hexagram 4: Youthful Folly`, 
            desc: `启蒙。缺乏经验，象征处于迷茫与学习阶段。应虚心求教，不可骄傲自大。 Inexperience. Indicates a time for education and finding guidance. Keep an open mind.` 
        }
        // --- Paste your remaining 60 hexagrams here following this exact backtick format! ---
    };

    function tossCoins() {
        if (currentToss >= 6) return;

        var btn = document.getElementById('tossBtn');
        var c1 = document.getElementById('coin1');
        var c2 = document.getElementById('coin2');
        var c3 = document.getElementById('coin3');

        c1.classList.add('spinning');
        c2.classList.add('spinning');
        c3.classList.add('spinning');
        btn.disabled = true;

        setTimeout(function() {
            var flip1 = Math.random() < 0.5 ? 3 : 2;
            var flip2 = Math.random() < 0.5 ? 3 : 2;
            var flip3 = Math.random() < 0.5 ? 3 : 2;
            var totalSum = flip1 + flip2 + flip3;

            c1.classList.remove('spinning');
            c2.classList.remove('spinning');
            c3.classList.remove('spinning');
            btn.disabled = false;

            c1.innerText = flip1 === 3 ? "Heads (3)" : "Tails (2)";
            c2.innerText = flip2 === 3 ? "Heads (3)" : "Tails (2)";
            c3.innerText = flip3 === 3 ? "Heads (3)" : "Tails (2)";

            processLine(totalSum);
        }, 500);
    }

    function processLine(sum) {
        var hexContainer = document.getElementById('hexagramArea');
        var lineDiv = document.createElement('div');
        
        var isYang = (sum === 7 || sum === 9);
        var isChanging = (sum === 6 || sum === 9);

        // Store 1 for Solid line, 0 for Broken line
        hexagramLines.push(isYang ? "1" : "0");

        if (isYang) {
            lineDiv.className = "line-yang" + (isChanging ? " changing" : "");
        } else {
            lineDiv.className = "line-yin" + (isChanging ? " changing" : "");
            lineDiv.innerHTML = "<div></div><div></div>";
        }

        hexContainer.appendChild(lineDiv);
        currentToss++;

        if (currentToss < 6) {
            document.getElementById('tossCounter').innerText = "Toss " + (currentToss + 1) + " of 6 ｜ 第 " + (currentToss + 1) + " 次投掷";
            document.getElementById('tossResultText').innerText = "Last sum ｜ 上次总和: " + sum;
        } else {
            document.getElementById('tossCounter').innerText = "Hexagram Constructed! ｜ 卦象已成！";
            document.getElementById('coinArea').classList.add('hidden');
            document.getElementById('decipherSection').classList.remove('hidden');
        }
    }

    function decipherHexagram() {
        var lookupKey = hexagramLines.join("");
        var interpretationBox = document.getElementById('interpretation');
        var resultData = hexagramDatabase[lookupKey];
        
        if (!resultData) {
            // Safe fallback reading if a key is missing during data migration
            resultData = {
                zh: "未录入卦象 [" + lookupKey + "]",
                en: "Hexagram ID: [" + lookupKey + "]",
                desc: "数据正在加载或该变体尚未录入数据块。 The custom dataset for this binary sequence is still initializing."
            };
        }

        var htmlContent = "<div class='chinese-title'>" + resultData.zh + "</div>" +
                          "<div style='font-weight:bold; color:#666; margin-bottom:15px;'>" + resultData.en + "</div>" +
                          "<hr style='border: 0; border-top: 1px dashed #8e2117; margin-bottom:15px;'>" +
                          "<div>" + resultData.desc + "</div>";

        interpretationBox.innerHTML = htmlContent;
        interpretationBox.classList.remove('hidden');
    }

    function resetOracle() {
        currentToss = 0;
        hexagramLines = [];
        document.getElementById('hexagramArea').innerHTML = "";
        document.getElementById('interpretation').classList.add('hidden');
        document.getElementById('decipherSection').classList.add('hidden');
        document.getElementById('coinArea').classList.remove('hidden');document.getElementById('tossCounter').innerText = "Toss 1 of 6 ｜ 第 1 次投掷";
        document.getElementById('tossResultText').innerText = "Coins ready for casting. ｜ 准备就绪。";}

    // Ensure your database object closes safely here before the functions start
};

function tossCoins() {
    if (currentToss >= 6) return;
    var btn = document.getElementById('tossBtn');
    var c1 = document.getElementById('coin1');
    var c2 = document.getElementById('coin2');
    var c3 = document.getElementById('coin3');

    c1.classList.add('spinning');
    c2.classList.add('spinning');
    c3.classList.add('spinning');
    btn.disabled = true;

    setTimeout(function() {
        var flip1 = Math.random() < 0.5 ? 3 : 2;
        var flip2 = Math.random() < 0.5 ? 3 : 2;
        var flip3 = Math.random() < 0.5 ? 3 : 2;
        var totalSum = flip1 + flip2 + flip3;
        
        c1.classList.remove('spinning');
        c2.classList.remove('spinning');
        c3.classList.remove('spinning');
        btn.disabled = false;

        c1.innerText = flip1 === 3 ? "Heads (3)" : "Tails (2)";
        c2.innerText = flip2 === 3 ? "Heads (3)" : "Tails (2)";
        c3.innerText = flip3 === 3 ? "Heads (3)" : "Tails (2)";
        
        processLine(totalSum);
    }, 600);
}

function processLine(sum) {
    var hexContainer = document.getElementById('hexagramArea');
    var lineDiv = document.createElement('div');
    var isYang = (sum === 7 || sum === 9);
    var isChanging = (sum === 6 || sum === 9);
    
    hexagramLines.push(isYang ? "1" : "0");

    if (isYang) {
        lineDiv.className = "line-yang" + (isChanging ? " changing" : "");
    } else {
        lineDiv.className = "line-yin" + (isChanging ? " changing" : "");
        // FIXED: Re-inserted the missing split blocks for Yin structure rendering!
        lineDiv.innerHTML = "<div></div><div></div>";
    }

    hexContainer.appendChild(lineDiv);
    currentToss++;

    if (currentToss < 6) {
        document.getElementById('tossCounter').innerText = "Toss " + (currentToss + 1) + " of 6 ｜ 第 " + (currentToss + 1) + " 次投掷";
        document.getElementById('tossResultText').innerText = "Last cast sum: " + sum + " ｜ 上次点数和: " + sum;
    } else {
        document.getElementById('tossCounter').innerText = "Hexagram Constructed! ｜ 卦象成！";
        document.getElementById('coinArea').classList.add('hidden');
        document.getElementById('decipherSection').classList.remove('hidden');
    }
}

function decipherHexagram() {
    var lookupKey = hexagramLines.join("");
    var interpretationBox = document.getElementById('interpretation');
    var resultData = hexagramDatabase[lookupKey];
    
    if (!resultData) {
        resultData = {
            zh: "未录入卦象 [" + lookupKey + "]",
            en: "Hexagram ID: [" + lookupKey + "]",
            desc: "该卦象尚未录入数据块。 This variant is processing data."
        };
    }

    var htmlContent = "<div class='chinese-title'>" + resultData.zh + "</div>" +
                      "<div style='font-weight:bold; color:#666; margin-bottom:15px;'>" + resultData.en + "</div>" +
                      "<hr style='border: 0; border-top: 1px dashed #8e2117; margin-bottom:15px;'>" +
                      "<div>" + resultData.desc + "</div>";

    interpretationBox.innerHTML = htmlContent;
    interpretationBox.classList.remove('hidden');
}
