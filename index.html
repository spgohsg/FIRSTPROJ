<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Ching Coin Toss</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { background: #4F46E5; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .coins { font-size: 24px; margin: 20px 0; font-weight: bold; }
        .hexagram { display: flex; flex-direction: column-reverse; margin-top: 20px; align-items: center; }
        .line { width: 150px; height: 12px; margin: 4px 0; background: #333; }
        .yin { background: repeating-linear-gradient(90deg, #333, #333 60px, transparent 60px, transparent 90px, #333 90px); }
        .status { font-weight: bold; margin-top: 15px; color: #4F46E5; }
    </style>
</head>
<body>

<div class="container">
    <h1>I Ching Oracle</h1>
    <p>Toss 3 coins, 6 times to build your hexagram.</p>
    
    <button id="tossBtn">Toss Coins</button>
    <button id="resetBtn" style="background:#ef4444; display:none;">Reset</button>
    
    <div class="status" id="statusMsg">Tosses: 0 / 6</div>
    <div class="coins" id="coinResults">- - -</div>
    
    <h3>Your Hexagram:</h3>
    <div class="hexagram" id="hexagramContainer"></div>
</div>

<script>
    let tossCount = 0;
    const maxTosses = 6;
    
    const tossBtn = document.getElementById('tossBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusMsg = document.getElementById('statusMsg');
    const coinResults = document.getElementById('coinResults');
    const hexagramContainer = document.getElementById('hexagramContainer');

    tossBtn.addEventListener('click', () => {
        if (tossCount >= maxTosses) return;

        // 1. Simulate tossing 3 coins (0 = Tails/Yin value 2, 1 = Heads/Yang value 3)
        let coin1 = Math.floor(Math.random() * 2);
        let coin2 = Math.floor(Math.random() * 2);
        let coin3 = Math.floor(Math.random() * 2);

        // Map 1 to "H" (Heads) and 0 to "T" (Tails)
        let c1Text = coin1 ? "H" : "T";
        let c2Text = coin2 ? "H" : "T";
        let c3Text = coin3 ? "H" : "T";
        coinResults.innerText = `${c1Text}  ${c2Text}  ${c3Text}`;

        // 2. Calculate I Ching line value (Heads = 3, Tails = 2)
        let v1 = coin1 ? 3 : 2;
        let v2 = coin2 ? 3 : 2;
        let v3 = coin3 ? 3 : 2;
        let total = v1 + v2 + v3;

        // 3. Determine if the line is Yang (Odd total: 7 or 9) or Yin (Even total: 6 or 8)
        let isYang = (total % 2 !== 0);

        // 4. Update the visual hexagram structure (built from bottom to top)
        const lineDiv = document.createElement('div');
        lineDiv.classList.add('line');
        if (!isYang) {
            lineDiv.classList.add('yin'); // Broken line
        }
        hexagramContainer.appendChild(lineDiv);

        // 5. Update toss counter
        tossCount++;
        statusMsg.innerText = `Tosses: ${tossCount} / 6`;

        // 6. Check if we hit the 6-toss limit
        if (tossCount === maxTosses) {
            tossBtn.disabled = true;
            statusMsg.innerText = "Hexagram Complete!";
            resetBtn.style.display = "inline-block";
        }
    });

    resetBtn.addEventListener('click', () => {
        tossCount = 0;
        hexagramContainer.innerHTML = "";
        coinResults.innerText = "- - -";
        statusMsg.innerText = "Tosses: 0 / 6";
        tossBtn.disabled = false;
        resetBtn.style.display = "none";
    });
</script>

</body>
</html>
