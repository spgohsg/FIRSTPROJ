<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun I-Ching Oracle</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f7f5f0; color: #333; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 5px solid #8b0000; }
        h1 { color: #8b0000; margin-bottom: 5px; }
        .subtitle { font-style: italic; color: #666; margin-bottom: 25px; }
        button { background-color: #8b0000; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #a00000; }
        .coins { font-size: 32px; margin: 20px 0; letter-spacing: 10px; }
        .result-box { margin-top: 25px; padding: 20px; border-radius: 8px; background-color: #fffaf0; border: 1px dashed #d2b48c; display: none; }
        .hex-line { font-size: 24px; font-weight: bold; letter-spacing: 5px; color: #8b0000; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>☯️ The Digital I-Ching Oracle</h1>
    <p class="subtitle">Think of a question, focus your energy, and toss the three coins.</p>
    
    <button onclick="tossCoins()">Toss 3 Coins</button>
    
    <div id="coinDisplay" class="coins">🪙 🪙 🪙</div>
    
    <div id="resultBox" class="result-box">
        <h3 id="lineType">Result</h3>
        <div id="lineVisual" class="hex-line"></div>
        <p id="interpretation"></p>
    </div>
</div>

<script>
    // Simplified database of the 4 types of ritual lines
    const readings = {
        6: { name: "Old Yin (Changing Line)", line: "—  — (❌)", text: "A valley or receptive energy that is changing. Yield, listen, and prepare for a transformation from passive to active." },
        7: { name: "Young Yang (Stable Line)", line: "———————", text: "Strong, active, and creative energy. Take initiative, stay confident, and push forward with clarity." },
        8: { name: "Young Yin (Stable Line)", line: "—  —", text: "Receptive, quiet, and nurturing energy. It is time to pause, listen, consult others, and remain steady." },
        9: { name: "Old Yang (Changing Line)", line: "——————— (⭕)", text: "Peak creative energy that is about to change. You have great momentum, but watch out for arrogance or pushing too hard." }
    };

    function tossCoins() {
        let results = [];
        let score = 0;
        
        // Toss 3 virtual coins (0 = Tails/value 2, 1 = Heads/value 3)
        for (let i = 0; i < 3; i++) {
            let coin = Math.floor(Math.random() * 2);
            results.push(coin === 1 ? "🟨" : "⬜"); // Heads (Gold) or Tails (Silver)
            score += (coin === 1 ? 3 : 2);
        }
        
        // Update coin symbols on screen
        document.getElementById('coinDisplay').innerText = results.join(" ");
        
        // Fetch matching I-Ching line reading
        const reading = readings[score];
        
        // Display data in interface
        document.getElementById('lineType').innerText = `${reading.name} (Value: ${score})`;
        document.getElementById('lineVisual').innerText = reading.line;
        document.getElementById('interpretation').innerText = reading.text;
        document.getElementById('resultBox').style.display = "block";
    }
</script>

</body>
</html>
