<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital I-Ching Oracle ｜ 易经占卜</title>
    <style>
        body {
            font-family: 'Segoe UI', 'Georgia', 'Noto Serif SC', serif;
            background-color: #fcf8f2;
            color: #2c1a04;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .oracle-box {
            background-color: #fffaf0;
            padding: 30px;
            border-radius: 16px;
            border: 2px solid #8e2117;
            box-shadow: 0 8px 24px rgba(142,33,23,0.15);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #8e2117; margin-top: 0; font-family: 'Times New Roman', serif; font-size: 24px; }
        .coin-container {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
        }
        .coin {
            width: 75px;
            height: 75px;
            background-color: #dfb15b;
            border: 4px solid #b3862b;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .spinning {
            animation: spin 0.1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
        button {
            background-color: #8e2117;
            color: #fffaf0;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background-color: #63140e; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .hexagram-display {
            display: flex;
            flex-direction: column-reverse; /* Builds bottom to top */
            align-items: center;
            margin: 25px 0;
            gap: 8px;
        }
        .line-yang {
            width: 180px;
            height: 14px;
            background-color: #2c1a04;
            border-radius: 2px;
        }
        .line-yin {
            display: flex;
            width: 180px;
            height: 14px;
            justify-content: space-between;
        }
        .line-yin div {
            width: 82px;
            height: 14px;
            background-color: #2c1a04;
            border-radius: 2px;
        }
        .changing {
            background-color: #d93025 !important;
        }
        .changing div {
            background-color: #d93025 !important;
        }
        .hidden { display: none !important; }
        .interpretation-panel {
            background-color: #f7ebd9;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid #8e2117;
            text-align: left;
            margin-top: 20px;
            line-height: 1.6;
        }
        .chinese-title {
            font-size: 22px;
            color: #8e2117;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .status-txt { font-style: italic; color: #666; margin: 15px 0; }
    </style>
</head>
<body>

<div class="oracle-box">
    <h1>☯️ I-Ching Oracle ｜ 易经占卜</h1>
    <p>Focus on your question, then cast the coins 6 times.</p>
    <p style="font-size:14px; color:#666; margin-top: 5px;">心中默念你的问题，投掷硬币 6 次以形成卦象。</p>
    
    <p id="tossCounter" style="font-weight: bold; color: #8e2117; margin-top:20px; font-size: 18px;">Toss 1 of 6 ｜ 第 1 次投掷</p>

    <!-- Coin Interface -->
    <div id="coinArea">
        <div class="coin-container">
            <div id="coin1" class="coin">Heads</div>
            <div id="coin2" class="coin">Heads</div>
            <div id="coin3" class="coin">Heads</div>
        </div>
        <p id="tossResultText" class="status-txt">Coins ready for casting. ｜ 准备就绪。</p>
        <button id="tossBtn" onclick="tossCoins()">🪙 Toss Coins ｜ 投掷硬币</button>
    </div>

    <!-- Hexagram Rendering Section -->
    <div id="hexagramArea" class="hexagram-display"></div>

    <!-- Deciphering Section -->
    <div id="decipherSection" class="hidden">
        <button style="background-color: #2c1a04;" onclick="decipherHexagram()">📖 Consult Wisdom ｜ 解卦</button>
        <div id="interpretation" class="interpretation-panel hidden"></div>
        <button style="margin-top: 15px; background-color: #666;" onclick="resetOracle()">🔄 Ask Another Question ｜ 重新占卜</button>
    </div>
</div>

<script>
    var currentToss = 0;
    var hexagramLines = []; 

    // Pure Trigram Properties Matrix
    var trigrams = {
        "111": { en: "Heaven (Qián)", cn: "天 (乾)", power: "Creative energy / 刚健自强" },
        "000": { en: "Earth (Kūn)", cn: "地 (坤)", power: "Receptive support / Absolute patience / 包容和顺" },
        "010": { en: "Water (Kǎn)", cn: "水 (坎)", power: "The abyss / Deep challenges / Risk management / 险陷陷重" },
        "101": { en: "Fire (Lí)", cn: "火 (离)", power: "Clinging clarity / High awareness / 明明辉耀" },
        "001": { en: "Thunder (Zhèn)", cn: "雷 (震)", power: "Arousing growth / Volatility / Sudden changes / 震动奋起" },
        "110": { en: "Wind (Xùn)", cn: "风 (巽)", power: "Gentle entry / Penetrating focus / 顺从深入" },
        "100": { en: "Mountain (Gèn)", cn: "山 (艮)", power: "Keeping still / Stability / Boundaries / 静止止步" },
        "011": { en: "Lake (Duì)", cn: "泽 (兑)", power: "Joyous interaction / Celebration / Expression / 喜悦悦泽" }
    };

    function tossCoins() {
        if (currentToss >= 6) return;

        var btn = document.getElementById('tossBtn');
        var c1 = document.getElementById('coin1');
        var c2 = document.getElementById('coin2');
        var c3 = document.getElementById('coin3');

        c1.classList.add('spinning');
        c2.classList.add('spinning');
        c3.classList.add('spinning');
        btn.disabled = true;

        setTimeout(function() {
            var flip1 = Math.random() < 0.5 ? 3 : 2;
            var flip2 = Math.random() < 0.5 ? 3 : 2;
            var flip3 = Math.random() < 0.5 ? 3 : 2;
            var totalSum = flip1 + flip2 + flip3;

            c1.classList.remove('spinning');
            c2.classList.remove('spinning');
            c3.classList.remove('spinning');
            btn.disabled = false;

            c1.innerText = flip1 === 3 ? "Heads (3)" : "Tails (2)";
            c2.innerText = flip2 === 3 ? "Heads (3)" : "Tails (2)";
            c3.innerText = flip3 === 3 ? "Heads (3)" : "Tails (2)";
            
            processLine(totalSum);
        }, 400);
    }

    function processLine(sum) {
        var hexContainer = document.getElementById('hexagramArea');
        var lineDiv = document.createElement('div');
        var isYang = (sum === 7 || sum === 9);
        var isChanging = (sum === 6 || sum === 9);
        
        hexagramLines.push(isYang ? "1" : "0");

        if (isYang) {
            lineDiv.className = "line-yang" + (isChanging ? " changing" : "");
        } else {
            lineDiv.className = "line-yin" + (isChanging ? " changing" : "");
            lineDiv.innerHTML = "<div></div><div></div>";
        }

        hexContainer.appendChild(lineDiv);
        currentToss++;

        if (currentToss < 6) {
            document.getElementById('tossCounter').innerText = "Toss " + (currentToss + 1) + " of 6 ｜ 第 " + (currentToss + 1) + " 次投掷";
            document.getElementById('tossResultText').innerText = "Last sum ｜ 上次总和: " + sum + (isChanging ? " (Changing Line! 变爻)" : "");
        } else {
            document.getElementById('tossCounter').innerText = "Hexagram Constructed! ｜ 卦象成！";
            document.getElementById('coinArea').classList.add('hidden');
            document.getElementById('decipherSection').classList.remove('hidden');
        }
    }

    function decipherHexagram() {
        var lookupKey = hexagramLines.join("");
        
        // Algorithmic extraction of the lower/upper trigram structures
        var lowerKey = lookupKey.substring(0, 3);
        var upperKey = lookupKey.substring(3, 6);
        
        var lowerTri = trigrams[lowerKey];
        var upperTri = trigrams[upperKey];

        var titleEN = upperTri.en + " over " + lowerTri.en;
        var titleZH = upperTri.cn.split(" ")[0] + lowerTri.cn.split(" ")[0] + "卦";
        
        if (lowerKey === upperKey) {
            titleEN = "Pure " + upperTri.en;
            titleZH = "纯" + upperTri.cn.split(" ")[0] + "卦 (重卦)";
        }

        var interpretationBox = document.getElementById('interpretation');
        
        var htmlContent = "<div class='chinese-title'>📊 " + titleZH + "</div>" +
                          "<div style='font-weight:bold; color:#8e2117; margin-bottom:15px;'>" + titleEN + "</div>" +
                          "<hr style='border: 0; border-top: 1px dashed #8e2117; margin-bottom:15px;'> " +
                          "<p><strong>Trigram Breakdown / 卦象构造:</strong><br>" +
                          "• Upper (上卦): " + upperTri.cn + " | " + upperTri.en + "<br>" +
                          "• Lower (下卦): " + lowerTri.cn + " | " + lowerTri.en + "</p>" +
                          "<p><strong>Wisdom Analysis / 占卜解读:</strong><br>" +
                          "中文: 此卦象由外在的「" + upperTri.power + "」与内在的「" + lowerTri.power + "」交互作用而成。事态发展正在经历内外能量的契合流转。保持本心，顺应天道发展。<br><br>" +
                          "English: This oracle dynamic shows outer conditions of [" + upperTri.power + "] meeting your inner foundation of [" + lowerTri.power + "]. Carefully balance environmental shifts with your internal stance. Do not rush paths forward.</p>";

        interpretationBox.innerHTML = htmlContent;
        interpretationBox.classList.remove('hidden');
    }

    function resetOracle() {
        currentToss = 0;
        hexagramLines = [];
        document.getElementById('hexagramArea').innerHTML = "";
        document.getElementById('interpretation').classList.add('hidden');
        document.getElementById('decipherSection').classList.add('hidden');
        document.getElementById('coinArea').classList.remove('hidden');
        document.getElementById('tossCounter').innerText = "Toss 1 of 6 ｜ 第 1 次投掷";
        document.getElementById('tossResultText').innerText = "Coins ready for casting. ｜ 准备就绪。";
    }
</script>

</body>
</html>
