<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>易经三钱占卜</title>
  <style>
    :root { --primary:#4F46E5; --success:#10B981; --danger:#EF4444; --gray:#6B7280; --ink:#1F2937; }
    body { font-family: system-ui, -apple-system, sans-serif; background:#F3F4F6; margin:0; padding:20px; color:var(--ink); text-align:center; }
    .card { max-width:620px; margin:20px auto; background:#fff; padding:24px; border-radius:14px; box-shadow:0 4px 8px rgba(0,0,0,.08); }
    h1 { color:var(--primary); margin-top:0; }
    button { background:var(--primary); color:white; border:0; border-radius:8px; padding:12px 18px; font-size:16px; font-weight:700; cursor:pointer; width:90%; margin:8px 0; }
    button.secondary { background:var(--success); }
    button.danger { background:var(--danger); }
    textarea { width:90%; min-height:80px; border:1px solid #d1d5db; border-radius:8px; padding:10px; font-size:15px; }
    .hidden { display:none !important; }
    .small { color:var(--gray); font-size:14px; }
    .hex-wrap { display:flex; gap:18px; justify-content:center; align-items:flex-start; flex-wrap:wrap; margin:16px 0; }
    .hex-box { background:#F9FAFB; border:1px solid #E5E7EB; border-radius:10px; padding:14px; min-width:220px; }
    .line { height:18px; margin:8px auto; display:flex; justify-content:center; align-items:center; gap:12px; }
    .solid { width:130px; height:12px; background:#111827; border-radius:3px; }
    .broken { display:flex; gap:18px; }
    .broken span { width:56px; height:12px; background:#111827; border-radius:3px; display:inline-block; }
    .changing { color:#EF4444; font-weight:700; font-size:13px; min-width:38px; text-align:left; }
    .result { text-align:left; background:#F9FAFB; border:1px solid #E5E7EB; border-radius:10px; padding:14px; margin-top:14px; }
    .coins { font-size:20px; line-height:1.8; text-align:left; display:inline-block; }
    .tag { display:inline-block; background:#EEF2FF; color:#3730A3; border-radius:999px; padding:4px 10px; font-size:13px; font-weight:700; margin:3px; }
    .section { background:#FFFFFF; border:1px solid #E5E7EB; border-radius:10px; padding:14px; margin:12px 0; }
    .section h3 { margin-top:0; color:var(--primary); }
    .section-title { display:inline-block; background:#EEF2FF; color:#3730A3; border-radius:999px; padding:4px 10px; font-size:13px; font-weight:700; margin-bottom:8px; }
    .muted { color:var(--gray); }
  </style>
</head>
<body>
  <div class="card">
    <h1>☯ 易经三钱占卜</h1>
    <p class="small">静心提出一个问题，然后投三枚硬币六次。第一爻在最下方，第六爻在最上方。</p>
    <textarea id="questionInput" placeholder="可选：写下你的问题，例如：这件事情下一步该如何判断？"></textarea>
    <button id="tossBtn">投三枚硬币 × 六次</button>
    <button id="resetBtn" class="danger">重新开始</button>

    <div id="status" class="small"></div>
    <div id="coinLog" class="coins"></div>

    <div id="resultArea" class="hidden">
      <div class="hex-wrap">
        <div class="hex-box">
          <h3>本卦：<span id="primaryName">---</span></h3>
          <div id="primaryHex"></div>
        </div>
        <div class="hex-box">
          <h3>之卦：<span id="changedName">---</span></h3>
          <div id="changedHex"></div>
        </div>
      </div>
      <div id="changingLinesBox"></div>
      <div class="result" id="readingBox"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDEaU5Tm2lpc-fH0r9-LJdKuKSF8_h0tf8",
      authDomain: "emo-card-game.firebaseapp.com",
      databaseURL: "https://emo-card-game-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "emo-card-game",
      storageBucket: "emo-card-game.firebasestorage.app",
      messagingSenderId: "621452932692",
      appId: "1:621452932692:web:b92c03843dc9023d42dfc1"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const bitsToHexagramNumber = {
  "111111": "1",
  "000000": "2",
  "100010": "3",
  "010001": "4",
  "111010": "5",
  "010111": "6",
  "010000": "7",
  "000010": "8",
  "111011": "9",
  "110111": "10",
  "111000": "11",
  "000111": "12",
  "101111": "13",
  "111101": "14",
  "001000": "15",
  "000100": "16",
  "100110": "17",
  "011001": "18",
  "110000": "19",
  "000011": "20",
  "100101": "21",
  "101001": "22",
  "000001": "23",
  "100000": "24",
  "100111": "25",
  "111001": "26",
  "100001": "27",
  "011110": "28",
  "010010": "29",
  "101101": "30",
  "001110": "31",
  "011100": "32",
  "001111": "33",
  "111100": "34",
  "000101": "35",
  "101000": "36",
  "101011": "37",
  "110101": "38",
  "001010": "39",
  "010100": "40",
  "110001": "41",
  "100011": "42",
  "111110": "43",
  "011111": "44",
  "000110": "45",
  "011000": "46",
  "010110": "47",
  "011010": "48",
  "101110": "49",
  "011101": "50",
  "100100": "51",
  "001001": "52",
  "001011": "53",
  "110100": "54",
  "101100": "55",
  "001101": "56",
  "011011": "57",
  "110110": "58",
  "010011": "59",
  "110010": "60",
  "110011": "61",
  "001100": "62",
  "101010": "63",
  "010101": "64"
};

    const statusEl = document.getElementById('status');
    const coinLog = document.getElementById('coinLog');
    const resultArea = document.getElementById('resultArea');

    function coin() {
      // 正面 = 3，反面 = 2。总数 6/7/8/9。
      return Math.random() < 0.5 ? { label:'正', value:3 } : { label:'反', value:2 };
    }

    function lineFromTotal(total) {
      if (total === 6) return { value:6, yang:false, changing:true, label:'老阴', changedYang:true };
      if (total === 7) return { value:7, yang:true, changing:false, label:'少阳', changedYang:true };
      if (total === 8) return { value:8, yang:false, changing:false, label:'少阴', changedYang:false };
      return { value:9, yang:true, changing:true, label:'老阳', changedYang:false };
    }

    function renderLine(line, markChanging=false) {
      const main = line.yang
        ? '<div class="solid"></div>'
        : '<div class="broken"><span></span><span></span></div>';
      const marker = markChanging && line.changing ? `<span class="changing">变</span>` : '<span class="changing"></span>';
      return `<div class="line">${main}${marker}</div>`;
    }

    function renderHexagram(containerId, lines, markChanging=false) {
      // lines 是由下往上，显示时要由上往下。
      const html = [...lines].reverse().map(line => renderLine(line, markChanging)).join('');
      document.getElementById(containerId).innerHTML = html;
    }

    function bitsFromLines(lines, changed=false) {
      return lines.map(line => {
        const yang = changed ? line.changedYang : line.yang;
        return yang ? '1' : '0';
      }).join('');
    }

    async function fetchHexagram(number) {
      const snap = await get(ref(db, `iching/hexagrams/${number}`));
      return snap.exists() ? snap.val() : null;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('\"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function fallback(number) {
      return {
        number,
        name: '未载入',
        fullName: '请先运行 seed-iching.html 上传资料',
        judgment: 'Firebase 中没有找到此卦资料。',
        modernMeaning: '请先使用 seed 页面建立 /iching/hexagrams 数据。',
        lineMeanings: {}
      };
    }

    document.getElementById('tossBtn').addEventListener('click', async () => {
      try {
        statusEl.textContent = '正在起卦...';
        coinLog.innerHTML = '';
        resultArea.classList.add('hidden');

        const lines = [];
        const logs = [];
        for (let i = 1; i <= 6; i++) {
          const coins = [coin(), coin(), coin()];
          const total = coins.reduce((sum, c) => sum + c.value, 0);
          const line = lineFromTotal(total);
          lines.push(line);
          logs.push(`第 ${i} 爻：${coins.map(c => c.label).join('、')} → ${total} → ${line.label}${line.changing ? '（变爻）' : ''}`);
        }
        coinLog.innerHTML = logs.map(x => `<div>${x}</div>`).join('');

        const primaryBits = bitsFromLines(lines, false);
        const changedBits = bitsFromLines(lines, true);
        const primaryNo = bitsToHexagramNumber[primaryBits];
        const changedNo = bitsToHexagramNumber[changedBits];

        const [primaryRaw, changedRaw] = await Promise.all([
          fetchHexagram(primaryNo), fetchHexagram(changedNo)
        ]);
        const primary = primaryRaw || fallback(primaryNo);
        const changed = changedRaw || fallback(changedNo);

        document.getElementById('primaryName').innerText = `${primary.number}. ${primary.fullName || primary.name}`;
        document.getElementById('changedName').innerText = `${changed.number}. ${changed.fullName || changed.name}`;

        renderHexagram('primaryHex', lines, true);
        const changedLines = lines.map(line => ({ ...line, yang: line.changedYang, changing:false }));
        renderHexagram('changedHex', changedLines, false);

        const changingLineNos = lines
          .map((line, idx) => line.changing ? idx + 1 : null)
          .filter(Boolean);

        document.getElementById('changingLinesBox').innerHTML = changingLineNos.length
          ? `<div>${changingLineNos.map(n => `<span class="tag">第 ${n} 爻变</span>`).join('')}</div>`
          : `<div><span class="tag">无变爻</span></div>`;

        const lineReadings = changingLineNos.map(n => {
          const text = primary.lineMeanings?.[String(n)] || '此爻暂无资料。';
          return `<li><strong>第 ${n} 爻：</strong>${escapeHtml(text)}</li>`;
        }).join('');

        const question = document.getElementById('questionInput').value.trim();
        const hasChangingLines = changingLineNos.length > 0;
        const isSameHexagram = primaryNo === changedNo;

        document.getElementById('readingBox').innerHTML = `
          ${question ? `<p><strong>所问：</strong>${escapeHtml(question)}</p>` : ''}

          <div class="section">
            <div class="section-title">① 本卦解读：当前处境</div>
            <h3>${escapeHtml(primary.number)}. ${escapeHtml(primary.fullName || primary.name)}</h3>
            <p><strong>卦意：</strong>${escapeHtml(primary.modernMeaning || primary.judgment || '')}</p>
            <p><strong>卦辞简释：</strong>${escapeHtml(primary.judgment || '')}</p>
            <p class="muted">本卦代表事情目前的状态、当下的气势，以及你现在面对的主要处境。</p>
          </div>

          <div class="section">
            <div class="section-title">② 变爻解读：关键转折</div>
            ${hasChangingLines
              ? `<p>${changingLineNos.map(n => `<span class="tag">第 ${n} 爻变</span>`).join('')}</p><ul>${lineReadings}</ul><p class="muted">变爻代表事情中最活跃、最容易变化的关键位置，可作为行动提醒。</p>`
              : `<p><strong>无变爻：</strong>此卦象较稳定，事情暂时没有明显转折，可主要参考本卦整体卦意。</p>`
            }
          </div>

          <div class="section">
            <div class="section-title">③ 之卦解读：发展方向</div>
            <h3>${escapeHtml(changed.number)}. ${escapeHtml(changed.fullName || changed.name)}</h3>
            ${isSameHexagram
              ? `<p>本次无变爻，因此本卦与之卦相同。</p>`
              : `<p><strong>趋势：</strong>${escapeHtml(changed.modernMeaning || changed.judgment || '')}</p><p><strong>卦辞简释：</strong>${escapeHtml(changed.judgment || '')}</p>`
            }
            <p class="muted">之卦代表事情经过变化之后可能走向的趋势，不宜当成绝对结果，而应视为方向提示。</p>
          </div>
        `;

        resultArea.classList.remove('hidden');
        statusEl.textContent = '完成。';
      } catch (err) {
        console.error(err);
        statusEl.textContent = '出错：' + err.message;
        alert('起卦失败：' + err.message);
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
